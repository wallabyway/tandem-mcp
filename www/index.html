<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tandem Viewer</title>

  <script src="https://static.tandem.autodesk.com/1.0.866/viewer3D.js"></script>
  <link href="https://static.tandem.autodesk.com/1.0.866/style.min.css" rel="stylesheet" type="text/css" />

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #1a1a2e;
      color: #e0e0e0;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      display: flex;
      align-items: center;
      gap: 1rem;
      padding: 0.75rem 1.5rem;
      background: #16213e;
      border-bottom: 1px solid #0f3460;
      flex-shrink: 0;
      z-index: 10;
    }

    header h1 {
      font-size: 1rem;
      font-weight: 600;
      color: #0696D7;
      white-space: nowrap;
    }

    .controls {
      display: flex;
      gap: 0.75rem;
      align-items: center;
      flex: 1;
    }

    select {
      padding: 0.4rem 0.75rem;
      background: #1a1a2e;
      border: 1px solid #0f3460;
      border-radius: 6px;
      color: #e0e0e0;
      font-size: 0.8125rem;
      min-width: 180px;
      cursor: pointer;
    }
    select:hover, input:hover { border-color: #0696D7; }
    select:focus, input:focus { outline: none; border-color: #0696D7; }

    .search-group {
      display: flex;
      gap: 0.4rem;
      align-items: center;
    }

    button {
      padding: 0.4rem 0.85rem;
      background: #0696D7;
      border: none;
      border-radius: 6px;
      color: #fff;
      font-size: 0.8125rem;
      cursor: pointer;
      white-space: nowrap;
      font-weight: 500;
    }
    button:hover:not(:disabled) { background: #0580b8; }
    button:disabled { opacity: 0.4; cursor: default; }
    button.secondary {
      background: transparent;
      border: 1px solid #0f3460;
      color: #a0a0a0;
    }
    button.secondary:hover:not(:disabled) { border-color: #0696D7; color: #e0e0e0; }

    #status {
      margin-left: auto;
      font-size: 0.75rem;
      color: #a0a0a0;
      white-space: nowrap;
    }

    #viewer-container {
      flex: 1;
      position: relative;
      overflow: hidden;
    }

    #viewer-container > div {
      position: absolute;
      inset: 0;
    }

    .adsk-viewing-viewer { background: #1a1a2e !important; }

    #loading-overlay {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #1a1a2e;
      z-index: 100;
      gap: 1rem;
    }

    .spinner {
      width: 40px;
      height: 40px;
      border: 3px solid #0f3460;
      border-top-color: #0696D7;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    .hidden { display: none !important; }
  </style>
</head>
<body>
  <header>
    <h1>Tandem Viewer</h1>
    <div class="controls">
      <select id="account-select" disabled>
        <option value="">Loading...</option>
      </select>
      <select id="facility-select" disabled>
        <option value="">Select facility...</option>
      </select>
      <div class="search-group">
        <button id="isolate-btn" disabled>Isolate Equipment</button>
        <button id="reset-btn" class="secondary" disabled>Show All</button>
      </div>
    </div>
    <span id="status">Initializing...</span>
  </header>

  <div id="viewer-container">
    <div id="loading-overlay">
      <div class="spinner"></div>
      <span>Connecting to Autodesk Tandem...</span>
    </div>
  </div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
