[project]
name = "tandem-mcp"
version = "0.1.0"
description = "MCP server for Autodesk Tandem digital twin platform"
requires-python = ">=3.10"
dependencies = [
    "fastmcp>=2.0.0",
    "httpx>=0.27.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tandem_mcp"]
